name: Update data and publish site

on:
  schedule:
    # 22:30 UTC, Monday to Friday: 6:30 pm in New York in summer, 5:30 pm in winter
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEC_CONTACT: ${{ vars.SEC_CONTACT }}
    steps:
      - name: Get the code
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Get the last published data (reused if a source fails today)
        run: |
          if git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previous; then
            cp previous/assets/data.json previous-data.json || true
          fi

      - name: Download fresh data
        working-directory: repo
        run: python3 -I scripts/update_all.py ../raw ../previous-data.json

      - name: Build the site
        working-directory: repo
        run: |
          PREV=""
          if [ -f ../previous-data.json ]; then PREV=../previous-data.json; fi
          python3 -I scripts/process.py . ../raw $PREV
          NAME="${GITHUB_REPOSITORY#*/}"
          BASE="/$NAME/"
          case "$NAME" in *.github.io) BASE="/";; esac
          if [ -f CNAME ]; then BASE="/"; fi
          python3 -I scripts/build_site.py . "$BASE"

      - name: Publish to the gh-pages branch
        working-directory: repo/site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site update for $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
